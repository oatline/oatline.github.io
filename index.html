<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>oatline</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="theme-color" content="#0E0E10">
<meta property="og:type" content="website">
<meta property="og:title" content="oatline — веб и графический дизайн">
<meta property="og:description" content="Визуальные концепции брендов и сайты с продуманным пользовательским опытом.">
<meta property="og:url" content="https://oatline.github.io/">
<link rel="canonical" href="https://oatline.github.io/">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@400;500;600&display=swap">
<style>
/* Layout: a quiet index. One hairline runs under the header and rules every project row; the work carries the colour. */
:root{
  --bg:#0E0E10; --surface:#18171A; --ink:#ECEAE4; --muted:#8F8C86; --line:#26252A; --accent:#B03442; --on-accent:#F3F1EC; color-scheme:dark;
  --stage:#0E0E10; --stage-ink:#F3F1EC; --stage-line:#2A2A2E; --sand:#CBBCB0; --iris:#B8424D; --lash:#E6DBCF; --tag:#6E2228; --glow:rgba(122,29,42,.5); --accent-hot:#C9434E; --serif:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gutr:max(16px,env(safe-area-inset-right,0px));
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:inherit}
img{max-width:100%;display:block;height:auto}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--gut);padding-right:var(--gutr)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px}
.logo{font:500 18px/1 var(--display);letter-spacing:-.01em;text-decoration:none}
.logo{display:inline-flex;align-items:center;gap:9px}
.logo-eye{width:34px;height:auto;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:9;stroke-linecap:round;stroke-linejoin:round;margin-top:-2px}
.logo-eye .dt{fill:currentColor;stroke:none}
.logo-eye .lw{fill:none;stroke-width:10}
.logo-eye .li{fill:#7A1F2A;stroke:none}
.logo-eye .lu{fill:currentColor;stroke:none}
.logo-eye .lid{transform-box:view-box;transform-origin:200px 162px}
.logo:hover .logo-eye .lid{animation:logoBlink .45s ease-in-out}
@keyframes logoBlink{45%{transform:scaleY(.08)}}
@media (prefers-reduced-motion:reduce){.logo:hover .logo-eye .lid{animation:none}}
nav{display:flex;gap:24px;font-size:14px}
nav a{text-decoration:none;color:var(--muted)}
nav a:hover{color:var(--ink)}

.hero{padding-block:clamp(56px,10vw,120px) clamp(40px,6vw,72px)}
.hero h1{font:500 clamp(30px,5.4vw,68px)/1.08 var(--display);letter-spacing:-.025em;margin:0;max-width:17ch;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero-row{display:flex;flex-wrap:wrap;align-items:center;gap:16px 32px;margin-top:36px}
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:500;padding:14px 22px;border-radius:999px;font-size:15px}
.btn:hover{background:var(--accent);color:var(--on-accent)}
.hero-row p{margin:0;color:var(--muted);font-size:15px}

nav{align-items:center}
.nav-cta{color:var(--ink)!important;border:1px solid var(--line);border-radius:999px;padding:7px 14px;transition:border-color .25s,background .25s}
.nav-cta:hover{border-color:var(--accent);background:var(--accent);color:#F3F1EC!important}
@media (max-width:480px){nav{gap:14px!important;font-size:13px}nav a[href="#contacts"]{display:none}.nav-cta{padding:6px 12px}}
.case-cta{display:flex;align-items:center;justify-content:space-between;gap:24px 40px;flex-wrap:wrap;margin:72px 0 8px;padding:36px 40px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(60% 120% at 100% 50%,rgba(122,29,42,.28),transparent 70%),var(--surface)}
.case-cta h2{font:500 clamp(22px,2.6vw,30px)/1.15 var(--display);margin:0 0 8px;letter-spacing:-.015em}
.case-cta p{margin:0;color:var(--muted);font-size:15px;max-width:46ch}
.case-cta .btn{background:var(--ink);color:var(--bg)}
.case-cta .btn:hover{background:var(--accent);color:#F3F1EC}
@media (max-width:820px){.case-cta{padding:28px 22px}}
.label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:56px 32px;padding-block:8px 96px}
.card{text-decoration:none;display:flex;flex-direction:column;gap:16px}
.card.wide{grid-column:1/-1}
.card .shot{overflow:hidden;background:var(--surface);aspect-ratio:16/10;border-radius:4px}
.card.wide .shot{aspect-ratio:16/8}
.card.pair2 .shot{aspect-ratio:2/1}
.card .shot img{width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .6s ease}
.card:hover .shot img:not(.scroll){transform:scale(1.025)}
.card .shot{position:relative}
.card .shot img.scroll{position:absolute;inset:0 0 auto 0;height:auto;object-fit:initial;opacity:0;transform:translateY(0);transition:opacity .45s ease,transform .6s cubic-bezier(.45,0,.2,1);pointer-events:none}
.card.scrolling .shot img.scroll{opacity:1;transform:translateY(var(--dy,0px));transition:opacity .45s ease,transform var(--dur,6s) cubic-bezier(.45,0,.55,1) .35s}
@keyframes lid{0%{clip-path:ellipse(50% 0% at 50% 50%)}40%{clip-path:ellipse(52% 34% at 50% 50%)}100%{clip-path:ellipse(75% 75% at 50% 50%)}}
@keyframes lidImg{from{transform:scale(1.14)}to{transform:scale(1)}}
.rv .works .card.reveal:not(.in) .shot{clip-path:ellipse(50% 0% at 50% 50%)}
.rv .works .card.reveal.in .shot{animation:lid 1.25s cubic-bezier(.7,0,.2,1) both}
.rv .works .card.reveal.in .shot img:not(.scroll){animation:lidImg 1.6s cubic-bezier(.2,.7,.2,1) both}
.rv .works .card.reveal:not(.in){transform:none}
@media (prefers-reduced-motion:reduce){.rv .works .card .shot,.rv .works .card .shot img{animation:none!important;clip-path:none!important}.card .shot img.scroll{display:none}}
.meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;border-top:1px solid var(--line);padding-top:14px}
.meta h3{margin:0;font:500 20px/1.25 var(--display);letter-spacing:-.01em}
.meta p{margin:0;color:var(--muted);font-size:15px;grid-column:1}
.tag{font-size:13px;letter-spacing:.01em;color:var(--muted);white-space:nowrap;align-self:start;padding-top:4px;display:inline-flex;align-items:center;gap:8px}
.tag.live{color:var(--ink);opacity:.85}
.tag.live::before{content:"";width:6px;height:6px;border-radius:50%;background:#5FBF8A;box-shadow:0 0 0 0 rgba(95,191,138,.5);animation:livePulse 2.4s ease-out infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(95,191,138,.45)}70%,100%{box-shadow:0 0 0 7px rgba(95,191,138,0)}}

.steps{border-top:1px solid var(--line);padding-block:64px 96px}
.steps-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px;align-items:end;margin-bottom:56px}
.steps-head h2{font:500 26px/1.2 var(--display);margin:0;letter-spacing:-.015em}
.steps-head p{margin:0;color:var(--muted);font-size:16px;max-width:52ch}
.steps-line{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;position:relative}
.steps-line::before{content:"";position:absolute;left:7px;right:0;top:7px;height:1px;background:linear-gradient(90deg,var(--line),var(--accent));transform-origin:left;transform:scaleX(0);transition:transform 1.6s cubic-bezier(.6,0,.2,1)}
.steps.in .steps-line::before,html:not(.rv) .steps-line::before{transform:scaleX(1)}
.steps-line li{position:relative;padding:0 4px 0 0}
.sd{display:block;width:15px;height:15px;border-radius:50%;border:1px solid var(--muted);background:var(--bg);margin-bottom:28px;position:relative;z-index:1;transform:scale(0);transition:transform .6s cubic-bezier(.2,.9,.25,1.4) calc(var(--d) + .4s),background-color .4s ease calc(var(--d) + .6s),border-color .4s ease calc(var(--d) + .6s)}
.steps.in .sd,html:not(.rv) .sd{transform:scale(1);border-color:var(--accent)}
.steps.in li:last-child .sd,html:not(.rv) li:last-child .sd{background:var(--accent);box-shadow:0 0 14px var(--accent)}
.steps-line b{display:block;font:500 46px/1 var(--display);letter-spacing:-.03em;color:transparent;-webkit-text-stroke:1px var(--muted);margin-bottom:14px}
.steps-line strong{display:block;font:500 18px/1.25 var(--display);margin-bottom:8px}
.steps-line span{display:block;color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:16px}
.steps-line em{font-style:normal;font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:5px 12px;display:inline-block}
.steps-line li:hover b{color:var(--accent);-webkit-text-stroke-color:var(--accent);transition:color .3s}
@media (max-width:820px){.steps-head{grid-template-columns:minmax(0,1fr);gap:12px;margin-bottom:40px}.steps-line{grid-template-columns:minmax(0,1fr);gap:36px}.steps-line::before{left:7px;right:auto;top:7px;bottom:7px;width:1px;height:auto;background:linear-gradient(180deg,var(--line),var(--accent));transform:scaleY(0);transform-origin:top}.steps.in .steps-line::before,html:not(.rv) .steps-line::before{transform:scaleY(1)}.steps-line li{padding-left:40px}.sd{position:absolute;left:0;top:0}}
@media (prefers-reduced-motion:reduce){.sd{transform:none!important}.steps-line::before{transform:none!important}}
.does{border-top:1px solid var(--line);padding-block:56px 88px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:32px}
.does h2{font:500 26px/1.2 var(--display);margin:0;letter-spacing:-.015em}
.does ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px}
.does li strong{display:block;font-weight:600;margin-bottom:6px}
.does li span{color:var(--muted);font-size:15px}

footer{border-top:1px solid var(--line);background:var(--surface)}
footer .wrap{padding-block:56px calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:24px}
footer h2{font:500 clamp(26px,4vw,44px)/1.1 var(--display);margin:0;letter-spacing:-.02em}
.contacts{display:flex;flex-direction:column;gap:6px;font-size:16px}
.tg{color:var(--ink);text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:4px}.tg:hover{color:var(--accent)}
.fill{border:1px dashed var(--line);padding:2px 8px;border-radius:4px;color:var(--muted)}

/* case view */
.case{padding-block:40px 96px}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.case h1{font:500 clamp(28px,4.6vw,56px)/1.1 var(--display);letter-spacing:-.025em;margin:20px 0 0;max-width:20ch;text-wrap:balance}
.case .lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:60ch;margin:20px 0 0}
dl.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;border-block:1px solid var(--line);padding-block:20px;margin:40px 0}
dl.facts div{min-width:0}
dl.facts dt{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
dl.facts dd{margin:6px 0 0;font-size:15px;overflow-wrap:anywhere}
dl.facts a{color:var(--accent)}
.figure{margin:0 0 48px}
.figure img{width:100%;border-radius:4px;background:var(--surface)}
.figure figcaption{font-size:13px;color:var(--muted);margin-top:10px}
.pair{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1fr);gap:24px;align-items:start;margin-bottom:48px}
.pair .figure{margin:0}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:48px}
.duo .figure{margin:0}
.block{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;padding-block:28px;border-top:1px solid var(--line)}
.block h2{font:500 18px/1.3 var(--display);margin:0}
.block p,.block ul{margin:0;max-width:62ch}
.block ul{padding-left:18px;display:grid;gap:8px}
.text{margin-bottom:48px}
.next{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:24px;margin-top:24px;flex-wrap:wrap}
.next a{font:500 20px/1.2 var(--display);text-decoration:none}
.next a:hover{color:var(--accent)}
.gfx{display:flex;flex-direction:column;gap:64px;margin-top:48px}
.gfx .figure{margin:0}
.gfx h3{font:500 17px/1.3 var(--display);margin:14px 0 4px}
.gfx p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}
.g-row{display:flex;gap:24px;align-items:flex-start}
.g-row .figure{min-width:0}
.g-side{display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:48px;align-items:center}
.g-side img{max-height:82vh;width:auto;max-width:100%;justify-self:center}
.g-side h3{font-size:22px}
.g-merch{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:48px;align-items:center}
.g-pics{display:flex;gap:16px;align-items:flex-start}
.g-pics img{min-width:0;width:100%;height:auto;display:block;border-radius:4px}
.g-text h3{font:500 26px/1.2 var(--display);margin:10px 0 14px}
.g-text p{margin:0 0 22px;color:var(--ink);font-size:16px;line-height:1.55}
.g-text dl{margin:0}
.g-text dt{font-weight:600;font-size:15px;margin-top:16px}
.g-text dd{margin:2px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
@media (max-width:820px){.g-merch{grid-template-columns:minmax(0,1fr);gap:28px}}
.g-sheets{background:#dfe6ef;border-radius:14px;padding:clamp(20px,4vw,56px);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2.4vw,32px)}
.g-sheets img{display:block;width:100%;height:auto;box-shadow:0 22px 40px -22px rgba(30,50,85,.45)}
@media (max-width:820px){.g-sheets{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:72%;overflow-x:auto;scroll-snap-type:x mandatory;padding:20px}.g-sheets img{scroll-snap-align:center}}
.card.gfx-card .shot{background:#fff;display:flex;align-items:center;justify-content:center;padding:2.5%}
.card.gfx-card .shot img{object-fit:contain;object-position:center}
@media (max-width:820px){.g-row,.g-side{display:flex;flex-direction:column;gap:40px}.g-row .figure{flex:none!important;width:100%}.g-side{gap:0}.g-side img{max-height:none;width:100%}}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px;margin-top:40px}
.gallery .figure{margin:0}
.gallery .figure.span{grid-column:1/-1}
.gallery h3{font:500 17px/1.3 var(--display);margin:14px 0 4px}
.gallery p{margin:0;color:var(--muted);font-size:15px;max-width:60ch}


/* stage: the hook. Dark band, wordmark rises letter by letter, work flies out and floats around it */
.stage{position:relative;overflow:hidden;background:var(--stage);color:var(--stage-ink);isolation:isolate}
.stage::before{content:"";position:absolute;inset:-20%;background:radial-gradient(40% 35% at 50% 55%,var(--glow),transparent 70%);z-index:-1;animation:breathe 7s ease-in-out infinite alternate}
.stage .inner{position:relative;min-height:min(86vh,820px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding-block:96px 72px;padding-left:var(--gut);padding-right:var(--gutr)}
.kicker{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin:0 0 18px}
.word{font:600 clamp(64px,17vw,240px)/.9 var(--display);letter-spacing:-.05em;margin:0;display:flex;position:relative;z-index:2}
.word span{display:inline-block}
.word .dot{color:var(--accent-hot)}
.claim{font-size:clamp(17px,1.8vw,22px);line-height:1.45;max-width:34ch;margin:26px 0 0;position:relative;z-index:2;text-wrap:balance}
.stage .btn{margin-top:32px;background:var(--stage-ink);color:var(--stage);position:relative;z-index:2}
.stage .btn:hover{background:var(--accent-hot);color:var(--stage)}
.float{position:absolute;inset:0;z-index:1;pointer-events:none}
.float a{position:absolute;pointer-events:auto;width:var(--w);left:var(--x);top:var(--y);transform:translate(calc(var(--mx,0)*var(--d)*1px),calc(var(--my,0)*var(--d)*1px));transition:transform .4s ease-out}
.float a figure{margin:0;border-radius:6px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:fly 1.1s cubic-bezier(.2,.8,.2,1) both, bob var(--t,7s) ease-in-out infinite alternate;animation-delay:calc(var(--i)*90ms + .7s), calc(var(--i)*90ms + 1.8s);rotate:var(--r)}
.float a:hover figure{scale:1.06}
.float img{width:100%;display:block}
.marquee{border-block:1px solid var(--stage-line);overflow:hidden;white-space:nowrap;background:var(--stage);color:var(--stage-ink)}
.marquee div{display:inline-flex;gap:28px;padding-block:14px;animation:slide 32s linear infinite;font:500 15px/1 var(--display);letter-spacing:.02em}
.marquee i{font-style:normal;color:var(--accent-hot)}
@keyframes rise{from{transform:translateY(60%);opacity:0;filter:blur(8px)}to{transform:none;opacity:1;filter:none}}
@keyframes fadeup{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes fly{from{opacity:0;transform:translate(var(--fx),var(--fy)) scale(.4)}to{opacity:1;transform:none}}
@keyframes bob{from{translate:0 -8px}to{translate:0 10px}}
@keyframes slide{to{transform:translateX(-50%)}}
@keyframes breathe{from{opacity:.65;scale:.95}to{opacity:1;scale:1.08}}

.shot.phone{display:flex;align-items:flex-end;justify-content:center;padding-top:6%;background:var(--pb)}
.shot.phone img{width:auto!important;height:100%!important;max-width:58%;object-fit:cover;border-radius:18px 18px 0 0;box-shadow:0 18px 40px rgba(0,0,0,.35);border:6px solid #0d0d0d;border-bottom:0}
.card:hover .shot.phone img{transform:translateY(-6px)}
.browser{border-radius:10px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:0 24px 60px -30px rgba(0,0,0,.35)}
.browser img{display:block;width:100%;height:auto}
.browser .bar span{margin-left:10px;font-size:12px;color:var(--muted);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero-shot{margin:48px 0 56px}
.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px 24px;margin:56px 0}
.shots .figure{margin:0}
.shots .full{grid-column:1/-1}
.mob-band{background:var(--pb);border-radius:14px;padding:clamp(28px,5vw,64px) 16px clamp(20px,3vw,32px);margin:56px 0;display:flex;flex-direction:column;align-items:center;gap:20px}
.mob-band .label{color:rgba(255,255,255,.6)}
.mob-phones{display:flex;gap:clamp(14px,4vw,48px);justify-content:center;align-items:flex-start;width:100%}
.mob-phones figure{margin:0;flex:0 1 260px;min-width:0}
.mob-phones img{display:block;width:100%;border-radius:26px;border:6px solid #0d0d0d;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.mob-phones figcaption{font-size:13px;color:rgba(255,255,255,.72);margin-top:12px;text-align:center}
.mob-band.light .label,.mob-band.light figcaption{color:rgba(40,25,15,.7)}
.browser .bar{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.browser .bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.phones{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:48px}
.phones figure{margin:0;width:min(280px,100%)}
.phones img{border-radius:22px;border:6px solid #0d0d0d;width:100%}
